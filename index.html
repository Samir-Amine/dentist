<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment | BrightSmile Dental</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #f0fdfa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --error: #dc2626;
      --success: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(13, 148, 136, 0.15);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), #14b8a6);
      color: white;
      padding: 32px 28px;
      text-align: center;
    }
    .header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 6px; }
    .header p { opacity: 0.9; font-size: 0.95rem; }

    form { padding: 32px 28px; }

    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    .required { color: var(--error); }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
    }
    textarea { min-height: 90px; resize: vertical; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 20px;
    }
    .checkbox-group input { width: auto; }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .success-screen {
      display: none;
      text-align: center;
      padding: 50px 28px;
    }
    .success-screen h2 { color: var(--success); margin: 16px 0 8px; }
    .success-icon { font-size: 3.5rem; }

    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
    }
    .form-group.error input,
    .form-group.error select { border-color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>🦷 Book Your Appointment</h1>
        <p>Quick & easy scheduling — we’ll confirm shortly</p>
      </div>

      <form id="appointmentForm">
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="patientName" required placeholder="Jane Smith">
        </div>

        <div class="form-group">
          <label>Phone Number <span class="required">*</span></label>
          <input type="tel" name="phone" required placeholder="+1 555 123 4567">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="jane@email.com">
        </div>

        <div class="row">
          <div class="form-group">
            <label>Preferred Date <span class="required">*</span></label>
            <input type="date" name="appointmentDate" required>
          </div>
          <div class="form-group">
            <label>Time Slot <span class="required">*</span></label>
            <select name="timeSlot" required>
              <option value="">Select time</option>
              <option>09:00 AM</option>
              <option>09:30 AM</option>
              <option>10:00 AM</option>
              <option>10:30 AM</option>
              <option>11:00 AM</option>
              <option>11:30 AM</option>
              <option>01:00 PM</option>
              <option>01:30 PM</option>
              <option>02:00 PM</option>
              <option>02:30 PM</option>
              <option>03:00 PM</option>
              <option>03:30 PM</option>
              <option>04:00 PM</option>
              <option>04:30 PM</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Reason for Visit <span class="required">*</span></label>
          <select name="reason" required>
            <option value="">Select reason</option>
            <option>Routine Checkup</option>
            <option>Cleaning</option>
            <option>Emergency</option>
            <option>Filling / Restoration</option>
            <option>Consultation</option>
            <option>Whitening</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Additional Notes / Symptoms</label>
          <textarea name="notes" placeholder="Any details that will help us prepare..."></textarea>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" name="existingPatient" id="existing">
          <label for="existing" style="margin:0; font-weight:400;">I am an existing patient</label>
        </div>

        <button type="submit" id="submitBtn">Book Appointment</button>
      </form>

      <div class="success-screen" id="successScreen">
        <div class="success-icon">✅</div>
        <h2>Appointment Requested!</h2>
        <p>Thank you. We’ll confirm your appointment shortly by phone or email.</p>
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://hook.eu1.make.com/nce5i4qkymj73dhualsharp8w8h5u25j';  // ← paste your Make webhook here

    const form = document.getElementById('appointmentForm');
    const submitBtn = document.getElementById('submitBtn');
    const successScreen = document.getElementById('successScreen');

    // Set min date to today
    const dateInput = form.querySelector('[name="appointmentDate"]');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {
        patientName: formData.get('patientName').trim(),
        phone: formData.get('phone').trim(),
        email: formData.get('email').trim(),
        appointmentDate: formData.get('appointmentDate'),
        timeSlot: formData.get('timeSlot'),
        reason: formData.get('reason'),
        notes: formData.get('notes').trim(),
        existingPatient: formData.get('existingPatient') === 'on'
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Booking...';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!response.ok) throw new Error('Network response was not ok');

        // Hide form, show success
        form.style.display = 'none';
        successScreen.style.display = 'block';
      } catch (err) {
        alert('Something went wrong. Please try again or call the clinic.');
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Book Appointment';
      }
    });
  </script>
</body>
</html>
